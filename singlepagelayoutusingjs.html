<!DOCTYPE html>
<html>
<head>
    <title>React Single Page Layout</title>

    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>

    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>

    <style>
        body{
            font-family:"Times New Roman";
            margin:0;
            background:#f2f2f2;
        }

        header,footer{
            background:#2c3e50;
            color:white;
            text-align:center;
            padding:20px;
        }

        section{
            background:white;
            margin:20px;
            padding:20px;
            border-radius:10px;
            box-shadow:0px 0px 8px gray;
        }
    </style>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">

        function Header(){
            return(
                <header>
                    <h1>My React Website</h1>
                    <p>Single Page Application</p>
                </header>
            );
        }

        function About(){
            return(
                <section>
                    <h2>About</h2>
                    <p>This page is created using basic React.js components.</p>
                </section>
            );
        }

        function Services(){
            return(
                <section>
                    <h2>Services</h2>
                    <ul>
                        <li>Web Design</li>
                        <li>Frontend Development</li>
                        <li>UI Development</li>
                    </ul>
                </section>
            );
        }

        function Footer(){
            return(
                <footer>
                    <p>© 2026 React Application</p>
                </footer>
            );
        }

        function App(){
            return(
                <div>
                    <Header />
                    <About />
                    <Services />
                    <Footer />
                </div>
            );
        }

        ReactDOM.createRoot(
            document.getElementById("root")
        ).render(<App />);

    </script>
</body>
</html>
