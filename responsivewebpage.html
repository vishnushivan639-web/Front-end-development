<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Responsive Webpage</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      background:#f4f4f4;
    }

    /* Navbar */
    nav{
      background:#333;
      color:white;
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:15px 30px;
    }

    nav h2{
      font-size:28px;
    }

    nav ul{
      display:flex;
      list-style:none;
    }

    nav ul li{
      margin-left:20px;
    }

    nav ul li a{
      color:white;
      text-decoration:none;
      font-size:18px;
    }

    /* Hero Section */
    .hero{
      height:90vh;
      display:flex;
      justify-content:center;
      align-items:center;
      flex-direction:column;
      text-align:center;
      background:linear-gradient(to right, #4facfe, #00f2fe);
      color:white;
      padding:20px;
    }

    .hero h1{
      font-size:50px;
      margin-bottom:15px;
    }

    .hero p{
      font-size:20px;
      margin-bottom:20px;
    }

    .hero button{
      padding:12px 25px;
      border:none;
      background:white;
      color:#333;
      font-size:18px;
      border-radius:5px;
      cursor:pointer;
    }

    .hero button:hover{
      background:#333;
      color:white;
    }

    /* Cards Section */
    .container{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:20px;
      padding:40px;
    }

    .card{
      background:white;
      padding:20px;
      border-radius:10px;
      box-shadow:0 2px 8px rgba(0,0,0,0.2);
      text-align:center;
    }

    .card h3{
      margin-bottom:10px;
    }

    /* Footer */
    footer{
      background:#333;
      color:white;
      text-align:center;
      padding:15px;
    }

    /* Responsive Design */
    @media(max-width:768px){

      nav{
        flex-direction:column;
      }

      nav ul{
        flex-direction:column;
        margin-top:10px;
      }

      nav ul li{
        margin:10px 0;
      }

      .hero h1{
        font-size:35px;
      }

      .container{
        grid-template-columns:1fr;
      }
    }
  </style>
</head>

<body>

  <!-- Navbar -->
  <nav>
    <h2>My Website</h2>

    <ul>
      <li><a href="#">Home</a></li>
      <li><a href="#">About</a></li>
      <li><a href="#">Services</a></li>
      <li><a href="#">Contact</a></li>
    </ul>
  </nav>

  <!-- Hero Section -->
  <section class="hero">
    <h1>Responsive Webpage</h1>
    <p>Create Responsive Websites using HTML CSS and JavaScript</p>

    <button onclick="showMessage()">
      Click Me
    </button>
  </section>

  <!-- Cards -->
  <section class="container">

    <div class="card">
      <h3>HTML</h3>
      <p>Structure of the webpage</p>
    </div>

    <div class="card">
      <h3>CSS</h3>
      <p>Style and design of the webpage</p>
    </div>

    <div class="card">
      <h3>JavaScript</h3>
      <p>Add interactivity to webpage</p>
    </div>

  </section>

  <!-- Footer -->
  <footer>
    <p>© 2026 Responsive Website</p>
  </footer>

  <script>
    function showMessage(){
      alert("Welcome to Responsive Web Design!");
    }
  </script>

</body>
</html>
