<!DOCTYPE html>
<html>
<head>
  <title>Simple Bootstrap Page</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container text-center mt-3">
  <h2>My Website</h2>
  <p>This is a simple responsive page</p>
  <div class="card p-3 mb-3">
    <h5>My Card</h5>
    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#m">Open Modal</button>
  </div>
  <div class="row">
    <div class="col-md-4 bg-light p-3">Column 1</div>
    <div class="col-md-4 bg-warning p-3">Column 2</div>
    <div class="col-md-4 bg-info p-3">Column 3</div>
  </div>
</div>
<div class="modal fade" id="m">
  <div class="modal-dialog">
    <div class="modal-content p-3 text-center">
      <h5>Popup Message</h5>
      <button class="btn btn-danger" data-bs-dismiss="modal">Close</button>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
